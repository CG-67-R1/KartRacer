name: Refresh AU kart caches

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Refresh AU kart calendar cache
        working-directory: api
        run: npm run refresh-au-kart-calendar

      - name: Commit cache updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/data/au-kart-events.json
          if git diff --staged --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "chore: refresh AU kart calendar cache [skip render]"
            git push
          fi
